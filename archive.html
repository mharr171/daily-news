<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Archive | Live Full Stack</title>
<meta name="description" content="Every past edition of Live Full Stack, by month.">
<link rel="preload" href="fonts/anton-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/old-standard-tt-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts/fonts.css">

<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="alternate" type="application/rss+xml" title="Live Full Stack" href="https://www.livefullstack.com/feed.xml">
<link rel="canonical" href="https://www.livefullstack.com/archive.html">

<style>
  :root {
    --paper: #E9E6DD; --ink: #222120; --muted: #5E5A52; --rule: #222120;
    --soft-rule: #B9B3A6; --spot: #A8231B;
    --band: #A8231B; --on-band: #F6EFE6;
    --serif: "Old Standard TT", Georgia, "Times New Roman", serif;
    --display: "Anton", Impact, "Arial Narrow Bold", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1B1A18; --ink: #E7E2D6; --muted: #A59F92; --rule: #E7E2D6;
      --soft-rule: #4A463F; --spot: #E2675C;
      --band: #8E2019; --on-band: #F6EFE6;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: var(--paper); scroll-padding-top: 1rem; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 18px/1.55 var(--serif);
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  .page { max-width: 68rem; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
  a { color: inherit; }
  a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--spot); outline-offset: 3px; }

  /* Masthead (matches the edition pages) */
  .cover { display: flex; justify-content: space-between; align-items: flex-end;
           flex-wrap: wrap; gap: .25rem 1.5rem; padding-bottom: .4rem; }
  .nameplate { font-family: var(--display); font-weight: 400; text-transform: uppercase;
               font-size: clamp(2.4rem, 8vw, 4.4rem); line-height: .9; margin: 0; }
  .nameplate a { text-decoration: none; }
  .home { margin: 0 0 .3rem auto; font-style: italic; font-size: .95rem; }
  .band { display: flex; justify-content: space-between; flex-wrap: wrap; gap: .25rem 1rem;
          background: var(--band); color: var(--on-band); padding: .4rem 1rem; font-size: .9rem; }
  .band .tag { font-style: italic; }

  /* Page heading */
  .archive-head { padding: 1.75rem 0 1.25rem; border-bottom: 2px solid var(--rule);
                  display: flex; justify-content: space-between; align-items: flex-end;
                  flex-wrap: wrap; gap: 1rem 2rem; }
  .stamp { color: var(--spot); font-style: italic; margin: 0 0 .25rem; }
  .archive-head h1 { font-family: var(--display); font-weight: 400; text-transform: uppercase;
                     font-size: clamp(2.6rem, 9vw, 5rem); line-height: .9; margin: 0; letter-spacing: .01em; }
  .tally { margin: 0; font-style: italic; color: var(--muted); text-align: right; line-height: 1.4; }
  .tally strong { font-style: normal; color: var(--ink); font-size: 1.6rem; display: block; line-height: 1; }
  @media (max-width: 30rem) { .tally { text-align: left; } }

  /* Search and filters */
  .tools { padding: 1rem 0; border-bottom: 1px solid var(--soft-rule);
           display: grid; gap: .75rem; }
  .search { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem .6rem; }
  .search label { font-style: italic; color: var(--muted); white-space: nowrap; }
  .search input { flex: 1 1 14rem; min-width: 0; width: 100%; font: inherit; color: var(--ink); background: transparent;
                  border: 0; border-bottom: 2px solid var(--ink); padding: .3rem .1rem; border-radius: 0; }
  .search input::placeholder { color: var(--muted); font-style: italic; }
  .chips { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
  .chips > span { font-style: italic; color: var(--muted); font-size: .9rem; margin-right: .2rem; }
  .chip { font: inherit; font-size: .85rem; color: var(--ink); background: transparent;
          border: 1px solid var(--soft-rule); padding: .2rem .7rem; cursor: pointer; border-radius: 0; }
  .chip:hover { border-color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  /* Month index */
  .months { display: flex; flex-wrap: wrap; gap: .3rem 1.1rem; padding: .7rem 0;
            border-bottom: 1px solid var(--soft-rule); font-size: .95rem; }
  .months span { font-style: italic; color: var(--muted); }
  .months a { font-weight: 700; text-decoration: none; }
  .months a:hover { text-decoration: underline; }

  /* Month sections */
  .month { padding-top: 1.75rem; }
  .month > h2 { font-family: var(--display); font-weight: 400; text-transform: uppercase;
                font-size: 1.9rem; letter-spacing: .01em; line-height: 1; margin: 0;
                padding-bottom: .4rem; border-bottom: 4px double var(--rule);
                display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
  .month > h2 small { font-family: var(--serif); text-transform: none; font-size: .95rem;
                      font-style: italic; color: var(--muted); letter-spacing: 0; }

  /* One row per edition */
  .entry { display: grid; grid-template-columns: 5.5rem 1fr; gap: 0 1.5rem;
           padding: 1.1rem 0 1.2rem; border-bottom: 1px solid var(--soft-rule); }
  .dateline { text-align: center; border-right: 1px solid var(--soft-rule); padding-right: 1.25rem; }
  .dateline .dow { display: block; font-style: italic; color: var(--muted); font-size: .85rem; }
  .dateline .day { display: block; font-family: var(--display); font-size: 2.8rem; line-height: 1; margin: .1rem 0; }
  .dateline .no { display: block; color: var(--spot); font-size: .8rem; font-style: italic; }
  .entry h3 { font-size: 1.4rem; line-height: 1.15; margin: 0 0 .4rem; }
  .entry h3 a { text-decoration: none; }
  .entry h3 a:hover { text-decoration: underline; }
  .entry .summary { margin: 0 0 .6rem; font-size: .95rem; color: var(--muted); }
  .entry ul { list-style: none; margin: 0 0 .6rem; padding: 0; columns: 2 18rem; column-gap: 1.5rem; font-size: .92rem; }
  .entry li { break-inside: avoid; padding: .2rem 0 .2rem .9rem; position: relative; line-height: 1.3; }
  .entry li::before { content: "\25AA"; position: absolute; left: 0; color: var(--spot); }
  .entry li .topic { font-style: italic; color: var(--muted); font-size: .8rem; }
  .entry .more { font-size: .9rem; font-weight: 700; }
  .count { font-style: italic; color: var(--muted); margin: 1rem 0 0; }
  .tier { font-family: var(--display); font-weight: 400; text-transform: uppercase; font-size: 1.15rem;
          letter-spacing: .02em; margin: 1.5rem 0 0; padding-bottom: .3rem; border-bottom: 4px double var(--rule);
          display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
  .tier small { font-family: var(--serif); text-transform: none; font-size: .9rem; font-style: italic;
                color: var(--muted); letter-spacing: 0; }
  .hit .meta { font-size: .85rem; color: var(--muted); margin: 0 0 .2rem; }
  .hit .meta a { font-weight: 700; color: var(--ink); }
  .hit .why { font-size: .92rem; font-style: italic; margin: 0 0 .5rem; }
  mark { background: color-mix(in srgb, var(--spot) 22%, transparent); color: inherit; padding: 0 .1em; }
  @media (max-width: 34rem) {
    .entry { grid-template-columns: 1fr; }
    .dateline { text-align: left; border-right: 0; padding: 0 0 .4rem; display: flex; gap: .6rem; align-items: baseline; }
    .dateline .day { font-size: 1.6rem; }
  }

  .notice { text-align: center; font-style: italic; color: var(--muted); padding: 3rem 1rem; }
  footer { margin-top: 2.5rem; border-top: 4px double var(--rule); padding-top: .75rem;
           display: flex; justify-content: space-between; flex-wrap: wrap; gap: .5rem;
           font-size: .9rem; color: var(--muted); }

  /* Print: black on white, no navigation, link addresses after headlines */
  @media print {
    :root { --paper: #fff; --ink: #000; --muted: #333; --rule: #000; --soft-rule: #999;
            --spot: #000; --band: #fff; --on-band: #000; color-scheme: light; }
    @page { margin: 1.5cm; }
    html, body { background: #fff; }
    body { font-size: 11pt; padding: 0; }
    .page { max-width: none; padding: 0; }
    .band { border-top: 1px solid #000; border-bottom: 1px solid #000; padding: .2rem 0; }
    .home, .contents, .edition-nav, .read, .more, .print-hide { display: none !important; }
    .story, .edition, .lead, .month li { break-inside: avoid; }
    h1, h2, h3, h4 { break-after: avoid; }
    .story h3 a[href^="http"]::after { content: attr(href); display: block; margin-top: .15rem;
                                       font-size: 8pt; font-weight: 400; line-height: 1.3;
                                       word-break: break-all; color: #333; }
    a { text-decoration: none; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <div class="cover">
      <p class="nameplate"><a href="./">Live Full Stack</a></p>
      <a class="home" href="./">Back to the front page</a>
    </div>
    <div class="band">
      <span>by The Gary Corp.</span>
      <span class="tag">Gary Garrison’s tailored news</span>
    </div>
  </header>

  <main>
    <header class="archive-head">
      <div>
        <p class="stamp">Every edition, newest first</p>
        <h1>The Archive</h1>
      </div>
      <p class="tally" id="tally"></p>
    </header>

    <div class="tools" id="tools" hidden>
      <div class="search">
        <label for="q">Search all stories</label>
        <input id="q" type="search" placeholder="e.g. 49ers, BART, Artemis" autocomplete="off">
      </div>
      <div class="chips" id="chips"><span>Topic:</span></div>
    </div>
    <nav class="months" id="months" aria-label="Jump to month" hidden><span>Jump to:</span></nav>

    <div id="list"><p class="notice">Pulling the bound volumes&hellip;</p></div>
  </main>

  <footer>
    <span>Compiled each morning by Claude.</span>
    <span><a href="./">Front page</a> · <a href="feed.xml">RSS feed</a></span>
  </footer>
</div>

<script>
(function () {
  const list = document.getElementById("list");
  const parse = d => new Date(d + "T12:00:00");
  const fmtLong = d => parse(d).toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" });

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function link(href, text, cls) { const a = el("a", cls, text); a.href = href; return a; }
  // Lowercase and drop accents so "el nino" finds "El Niño" (keeps string length for NFC text).
  const fold = t => String(t).normalize("NFC").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  // Search terms: the query split into words. Each term matches the start of a word,
  // so "warrior" finds "Warriors" but "art" doesn't find "start".
  const WORD = /[\p{L}\p{N}]+(?:['’][\p{L}]+)*/gu;
  const STOP = new Set("a an and are as at be by for from in is it of on or the to with".split(" "));
  const termsOf = q => (fold(q).match(WORD) || []).map(t => t.replace(/’/g, "'"));
  const tokensOf = t => (fold(t).match(WORD) || []).map(w => w.replace(/’/g, "'"));
  // Words of one or two letters (“el”, “ai”) must match a whole word, or “el” would find “election”.
  const hit = (w, t) => t.length <= 2 ? w === t : w.startsWith(t);
  const esc = t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

  // Append text with every word that starts with a search term wrapped in <mark>.
  function highlight(node, text, q) {
    const terms = Array.isArray(q) ? q : termsOf(q || "");
    if (!terms.length) { node.append(text); return node; }
    text = String(text).normalize("NFC");
    const lower = fold(text).length === text.length ? fold(text).replace(/’/g, "'") : text.toLowerCase().replace(/’/g, "'");
    const alt = terms.slice().sort((a, b) => b.length - a.length)
      .map(t => t.length <= 2 ? esc(t) + "(?![\\p{L}\\p{N}])" : esc(t) + "[\\p{L}\\p{N}'’]*").join("|");
    const re = new RegExp("(^|[^\\p{L}\\p{N}])(?:" + alt + ")", "gu");
    let i = 0, m;
    while ((m = re.exec(lower))) {
      const start = m.index + m[1].length, end = m.index + m[0].length;
      node.append(text.slice(i, start), el("mark", null, text.slice(start, end)));
      i = end;
      if (m[0].length === 0) re.lastIndex++;
    }
    node.append(text.slice(i));
    return node;
  }

  // Score one story against the search terms.
  // Tiers: 0 = the exact phrase, 1 = every word somewhere, 2+ = some of the words.
  // Returns null when the story doesn't match at all.
  function scoreStory(st, terms) {
    const fields = [st.t, st.s, st.w, st.src, st.c];
    const toks = [];          // all tokens, with a gap between fields so phrases can't cross them
    const inHead = [];        // whether each token is in the headline
    fields.forEach((f, fi) => {
      if (!f) return;
      tokensOf(f).forEach(w => { toks.push(w); inHead.push(fi === 0); });
      toks.push(null); inHead.push(false);
    });
    const hitsFor = terms.map(t => { const a = []; toks.forEach((w, i) => { if (w && hit(w, t)) a.push(i); }); return a; });
    const found = hitsFor.map(a => a.length > 0);
    const nFound = found.filter(Boolean).length;
    if (!nFound) return null;
    const head = hitsFor.some(a => a.some(i => inHead[i]));

    if (nFound === terms.length) {
      // Exact phrase: the terms appear back to back, in order.
      if (terms.length > 1) {
        for (const p of hitsFor[0]) {
          if (terms.every((t, k) => toks[p + k] && hit(toks[p + k], t))) {
            return { tier: 0, key: "phrase", near: 0, head: inHead[p] };
          }
        }
      } else {
        return { tier: 0, key: "phrase", near: 0, head };
      }
      // Every word: rank by the smallest stretch of text that holds them all.
      const pts = [];
      hitsFor.forEach((a, k) => a.forEach(i => pts.push([i, k])));
      pts.sort((x, y) => x[0] - y[0]);
      const cnt = new Array(terms.length).fill(0);
      let have = 0, lo = 0, best = Infinity;
      for (let hi = 0; hi < pts.length; hi++) {
        if (cnt[pts[hi][1]]++ === 0) have++;
        while (have === terms.length) {
          best = Math.min(best, pts[hi][0] - pts[lo][0]);
          if (--cnt[pts[lo][1]] === 0) have--;
          lo++;
        }
      }
      return { tier: 1, key: "all", near: best, head };
    }

    // Some words: a story must contain at least one word that isn't a filler word like “the”.
    if (!terms.some((t, k) => found[k] && !STOP.has(t))) return null;
    // More matched words rank higher; among equal counts, earlier words in the query come first.
    const key = found.map(f => (f ? "1" : "0")).join("");
    return { tier: 2 + (terms.length - nFound), key, near: 0, head };
  }

  let all = [], topic = "", query = "";
  // Full-text index (search.json), loaded the first time someone searches.
  let index = null, indexState = "idle";
  function loadIndex() {
    if (indexState !== "idle") return;
    indexState = "loading";
    fetch("search.json", { cache: "no-store" })
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(j => { index = j.editions || []; indexState = "ready"; render(); })
      .catch(() => { indexState = "failed"; render(); });
  }

  function renderStories() {
    const months = document.getElementById("months");
    months.hidden = true;
    const numberOf = Object.fromEntries(all.map(e => [e.date, e.no]));
    const terms = termsOf(query);
    const hits = [];
    index.forEach(ed => (ed.stories || []).forEach(st => {
      if (topic && st.c !== topic) return;
      const sc = terms.length ? scoreStory(st, terms) : null;
      if (sc) hits.push({ ed, st, sc });
    }));
    if (!hits.length) { list.replaceChildren(el("p", "notice", "No stories match that search.")); return; }

    // Order: tier, then (within “some words”) which words matched, then closeness, headline matches, newest.
    hits.sort((a, b) =>
      a.sc.tier - b.sc.tier ||
      (a.sc.key < b.sc.key ? 1 : a.sc.key > b.sc.key ? -1 : 0) ||
      a.sc.near - b.sc.near ||
      (b.sc.head - a.sc.head) ||
      (a.ed.d < b.ed.d ? 1 : a.ed.d > b.ed.d ? -1 : 0));

    const LIMIT = 150;
    const shown = hits.slice(0, LIMIT);
    const parts = [el("p", "count", hits.length + (hits.length === 1 ? " story matches" : " stories match") +
      (hits.length > shown.length ? ". Showing the best " + shown.length + "." : "."))];

    const quoteList = ws => ws.map(w => "“" + w + "”").join(ws.length === 2 ? " and " : ", ");
    function label(sc) {
      if (sc.key === "phrase") return terms.length > 1 ? "Exact phrase: “" + terms.join(" ") + "”" : "Matches “" + terms[0] + "”";
      if (sc.key === "all") return "All the words, not side by side";
      const ws = terms.filter((t, k) => sc.key[k] === "1");
      return "Only " + quoteList(ws);
    }
    const groupCounts = {};
    hits.forEach(h => { groupCounts[h.sc.key] = (groupCounts[h.sc.key] || 0) + 1; });

    let lastKey = null;
    shown.forEach(({ ed, st, sc }) => {
      if (terms.length > 1 && sc.key !== lastKey) {
        const n = groupCounts[sc.key];
        const h = el("h2", "tier", label(sc));
        h.append(el("small", null, n + (n === 1 ? " story" : " stories")));
        parts.push(h);
        lastKey = sc.key;
      }
      const row = el("article", "entry hit");
      const d = parse(ed.d);
      const dl = el("div", "dateline");
      dl.append(
        el("span", "dow", d.toLocaleDateString("en-US", { weekday: "short" })),
        el("span", "day", String(d.getDate())),
        el("span", "no", d.toLocaleDateString("en-US", { month: "short" }) + (numberOf[ed.d] ? " · No. " + numberOf[ed.d] : "")));
      const body = el("div");
      const meta = el("p", "meta");
      meta.append(st.c + " · From the ", link(ed.f, fmtLong(ed.d)), " edition");
      const h3 = el("h3");
      const a = link(st.u, "");
      a.target = "_blank"; a.rel = "noopener";
      highlight(a, st.t, terms);
      h3.append(a);
      body.append(meta, h3);
      if (st.s) body.append(highlight(el("p", "summary"), st.s, terms));
      if (st.w && tokensOf(st.w).some(w => terms.some(t => hit(w, t)))) {
        const w = el("p", "why"); w.append("Why it matters: "); highlight(w, st.w, terms); body.append(w);
      }
      if (st.src) body.append(highlight(el("p", "meta"), st.src, terms));
      row.append(dl, body);
      parts.push(row);
    });
    list.replaceChildren(...parts);
  }

  function matches(e) {
    const h = e.headlines || [];
    if (topic && !h.some(x => x.topic === topic)) return false;
    if (!query) return true;
    const toks = tokensOf([e.summary || "", fmtLong(e.date)].concat(h.map(x => x.title + " " + (x.topic || ""))).join(" "));
    return termsOf(query).every(t => toks.some(w => hit(w, t)));
  }

  function render() {
    if (query && indexState === "loading") { list.replaceChildren(el("p", "notice", "Searching every story…")); return; }
    if (query && indexState === "ready") { renderStories(); return; }
    const shown = all.filter(matches);
    const months = document.getElementById("months");
    months.querySelectorAll("a").forEach(a => a.remove());

    if (!shown.length) {
      list.replaceChildren(el("p", "notice", "No editions match that search."));
      months.hidden = true;
      return;
    }

    const groups = new Map();
    shown.forEach(e => {
      const key = e.date.slice(0, 7);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(e);
    });

    const parts = [];
    groups.forEach((eds, key) => {
      const label = parse(key + "-01").toLocaleDateString("en-US", { month: "long", year: "numeric" });
      const sec = el("section", "month");
      sec.id = "m-" + key;
      const h2 = el("h2", null, label);
      h2.append(el("small", null, eds.length + (eds.length === 1 ? " edition" : " editions")));
      sec.append(h2);

      eds.forEach(e => {
        const h = e.headlines || [];
        const row = el("article", "entry");
        const d = parse(e.date);
        const dl = el("div", "dateline");
        dl.append(
          el("span", "dow", d.toLocaleDateString("en-US", { weekday: "short" })),
          el("span", "day", String(d.getDate())),
          el("span", "no", d.toLocaleDateString("en-US", { month: "short" }) + " · No. " + e.no));
        const body = el("div");
        const h3 = el("h3");
        const a = link(e.file, "");
        highlight(a, h[0] ? h[0].title : fmtLong(e.date), query);
        h3.append(a);
        body.append(h3);
        if (e.summary) body.append(highlight(el("p", "summary"), e.summary, query));
        if (h.length > 1) {
          const ul = el("ul");
          h.slice(1).forEach(x => {
            const li = el("li");
            highlight(li, x.title, query);
            if (x.topic) li.append(" ", el("span", "topic", "· " + x.topic));
            ul.append(li);
          });
          body.append(ul);
        }
        body.append(link(e.file, "Read this edition", "more"));
        row.append(dl, body);
        sec.append(row);
      });
      parts.push(sec);
      months.append(link("#m-" + key, label));
    });
    months.hidden = groups.size < 2;
    list.replaceChildren(...parts);
  }

  function setup(data) {
    all = data.filter(e => e && e.date && e.file).sort((a, b) => a.date < b.date ? 1 : -1);
    all.forEach((e, i) => e.no = all.length - i);

    const tally = document.getElementById("tally");
    if (!all.length) {
      list.replaceChildren(el("p", "notice", "No editions yet. The first one will be filed here."));
      return;
    }
    const first = parse(all[all.length - 1].date).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
    tally.append(el("strong", null, all.length + (all.length === 1 ? " edition" : " editions")), "since " + first);

    const topics = [...new Set(all.flatMap(e => (e.headlines || []).map(x => x.topic).filter(Boolean)))].sort();
    const chips = document.getElementById("chips");
    ["All", ...topics].forEach(t => {
      const b = el("button", "chip", t);
      b.type = "button";
      b.setAttribute("aria-pressed", t === "All" ? "true" : "false");
      b.addEventListener("click", () => {
        topic = t === "All" ? "" : t;
        chips.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b ? "true" : "false"));
        render();
      });
      chips.append(b);
    });
    if (topics.length < 2) chips.hidden = true;

    document.getElementById("q").addEventListener("input", ev => {
      query = ev.target.value.trim();
      if (termsOf(query).length) loadIndex(); else query = "";
      render();
    });
    document.getElementById("tools").hidden = false;
    // Arriving from the front page's search box: archive.html?q=...
    const fromUrl = new URLSearchParams(location.search).get("q");
    if (fromUrl && fromUrl.trim()) {
      const box = document.getElementById("q");
      box.value = fromUrl.trim();
      query = box.value;
      if (termsOf(query).length) loadIndex(); else query = "";
    }
    render();
  }

  fetch("posts.json", { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => setup(Array.isArray(data) ? data : (data.editions || [])))
    .catch(() => list.replaceChildren(
      el("p", "notice", "The editions list couldn’t be loaded. Refresh the page, or try again in a moment.")));
})();
</script>
</body>
</html>
