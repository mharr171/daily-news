<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{DATE_LONG}} | Live Full Stack</title>
<meta name="description" content="Live Full Stack, issue {{ISSUE_NO}}: {{DATE_LONG}}.">
<link rel="preload" href="../fonts/anton-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/old-standard-tt-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="icon" href="../favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

<meta property="og:site_name" content="Live Full Stack">
<meta property="og:title" content="{{DATE_LONG}} | Live Full Stack">
<meta property="og:description" content="{{SUMMARY}}">
<meta property="og:url" content="https://www.livefullstack.com/posts/{{DATE}}.html">

<meta property="og:image:height" content="630">

<style>
  :root {
    --paper: #E9E6DD; --ink: #222120; --muted: #5E5A52; --rule: #222120;
    --soft-rule: #B9B3A6; --spot: #A8231B;
    --band: #A8231B; --on-band: #F6EFE6;
    --serif: "Old Standard TT", Georgia, "Times New Roman", serif;
    --display: "Anton", Impact, "Arial Narrow Bold", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1B1A18; --ink: #E7E2D6; --muted: #A59F92; --rule: #E7E2D6;
      --soft-rule: #4A463F; --spot: #E2675C;
      --band: #8E2019; --on-band: #F6EFE6;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); scroll-padding-top: 1rem; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 18px/1.6 var(--serif);
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  .page { max-width: 68rem; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
  a { color: inherit; }
  a:focus-visible { outline: 2px solid var(--spot); outline-offset: 4px; }

  /* Masthead (smaller than the front page) */
  .cover { display: flex; justify-content: space-between; align-items: flex-end;
           flex-wrap: wrap; gap: .25rem 1.5rem; padding-bottom: .4rem; }
  .nameplate { font-family: var(--display); font-weight: 400; text-transform: uppercase;
               font-size: clamp(2.4rem, 8vw, 4.4rem); line-height: .9; margin: 0; }
  .nameplate a { text-decoration: none; }
  .home { margin: 0 0 .3rem auto; font-style: italic; font-size: .95rem; }
  .band { display: flex; justify-content: space-between; flex-wrap: wrap; gap: .25rem 1rem;
          background: var(--band); color: var(--on-band); padding: .4rem 1rem; font-size: .9rem; }
  .band .tag { font-style: italic; }

  /* Edition heading */
  .edition-head { padding: 1.75rem 0 1.25rem; border-bottom: 2px solid var(--rule); max-width: 48rem; }
  .stamp { color: var(--spot); font-style: italic; margin: 0 0 .25rem; }
  .edition-head h1 { font-size: clamp(2rem, 5.5vw, 3.4rem); line-height: 1.05; margin: 0 0 1rem; }
  .summary { margin: 0; text-align: justify; hyphens: auto; }
  .summary::first-letter { font-size: 3.4em; float: left; line-height: .85;
                           padding: .08em .1em 0 0; font-weight: 700; }

  /* In this edition: built automatically from the topic headings */
  .contents { display: flex; flex-wrap: wrap; gap: .4rem 1.25rem; padding: .75rem 0;
              border-bottom: 1px solid var(--soft-rule); font-size: .95rem; }
  .contents span { font-style: italic; color: var(--muted); }
  .contents a { font-weight: 700; text-decoration: none; }
  .contents a:hover { text-decoration: underline; }

  /* Topics and stories */
  .topic { padding-top: 1.75rem; }
  .topic > h2 { font-family: var(--display); font-weight: 400; text-transform: uppercase;
                font-size: 1.9rem; letter-spacing: .01em; line-height: 1; margin: 0 0 .25rem;
                padding-bottom: .4rem; border-bottom: 4px double var(--rule); }
  .stories { display: grid; grid-template-columns: 1fr; }
  @media (min-width: 46rem) { .stories { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .story { padding: 1rem 0 1.25rem; border-bottom: 1px solid var(--soft-rule); }
  @media (min-width: 46rem) {
    .story { padding: 1rem 1.5rem 1.25rem 0; }
    .story:nth-child(even) { padding: 1rem 0 1.25rem 1.5rem; border-left: 1px solid var(--soft-rule); }
    .story:first-child { grid-column: 1 / -1; padding-right: 0; }
    .story:first-child ~ .story:nth-child(even) { padding: 1rem 1.5rem 1.25rem 0; border-left: 0; }
    .story:first-child ~ .story:nth-child(odd) { padding: 1rem 0 1.25rem 1.5rem; border-left: 1px solid var(--soft-rule); }
  }
  .story h3 { font-size: 1.3rem; line-height: 1.2; margin: 0 0 .45rem; }
  .story:first-child h3 { font-size: clamp(1.6rem, 3.6vw, 2.2rem); line-height: 1.1; }
  .story h3 a { text-decoration: none; }
  .story h3 a:hover { text-decoration: underline; }
  .story p { margin: 0 0 .5rem; }
  .why { font-style: italic; }
  .why strong { font-style: normal; color: var(--spot); }
  .source { font-size: .88rem; color: var(--muted); margin: 0; }

  /* Sunday: Coming up */
  .upcoming { list-style: none; margin: .5rem 0 0; padding: 0; columns: 2 20rem; column-gap: 2.5rem; }
  .upcoming li { break-inside: avoid; padding: .55rem 0; border-bottom: 1px dotted var(--soft-rule); line-height: 1.35; }
  .upcoming .when { display: block; font-size: .82rem; font-style: italic; color: var(--spot); }
  .upcoming a { font-weight: 700; text-decoration: none; }
  .upcoming a:hover { text-decoration: underline; }
  .upcoming .kind { font-size: .82rem; font-style: italic; color: var(--muted); }


  /* Edition navigation */
  .edition-nav { margin-top: 2.5rem; border-top: 4px double var(--rule); padding-top: .75rem;
                 display: grid; grid-template-columns: 1fr auto 1fr; gap: 1rem; font-size: .95rem; }
  .edition-nav .next { text-align: right; }
  .edition-nav .front { text-align: center; font-weight: 700; }
  .credit { text-align: center; color: var(--muted); font-size: .85rem; font-style: italic; margin-top: 1.5rem; }

  /* Print: black on white, no navigation, link addresses after headlines */
  @media print {
    :root { --paper: #fff; --ink: #000; --muted: #333; --rule: #000; --soft-rule: #999;
            --spot: #000; --band: #fff; --on-band: #000; color-scheme: light; }
    @page { margin: 1.5cm; }
    html, body { background: #fff; }
    body { font-size: 11pt; padding: 0; }
    .page { max-width: none; padding: 0; }
    .band { border-top: 1px solid #000; border-bottom: 1px solid #000; padding: .2rem 0; }
    .home, .contents, .edition-nav, .read, .more, .print-hide { display: none !important; }
    .story, .edition, .lead, .month li { break-inside: avoid; }
    h1, h2, h3, h4 { break-after: avoid; }
    .story h3 a[href^="http"]::after { content: attr(href); display: block; margin-top: .15rem;
                                       font-size: 8pt; font-weight: 400; line-height: 1.3;
                                       word-break: break-all; color: #333; }
    a { text-decoration: none; }
  }
</style>
<link rel="stylesheet" href="../assets/edition.css">
<script src="../assets/reader.js"></script>
</head>
<body data-date="{{DATE}}">
<div class="page">
  <header class="masthead">
    <div class="cover">
      <p class="nameplate"><a href="../">Live Full Stack</a></p>
      <a class="home" href="../">Back to the front page</a>
    </div>
    <div class="band">
      <span>by The Gary Corp.</span>
      <span class="tag">Gary Garrison’s tailored news</span>
    </div>
  </header>

  <main>
    <header class="edition-head">
      <p class="stamp">Issue No. {{ISSUE_NO}}</p>
      <h1>{{DATE_LONG}}</h1>
      <p class="summary">{{SUMMARY}}</p>
    </header>

    <section class="brief" aria-labelledby="brief-h">
      <h2 id="brief-h">The day in <span>60 seconds</span></h2>
      <ul>
{{BRIEF}}
      </ul>
    </section>

    <aside class="today-box" id="today-box" aria-label="Today in and around Millbrae">{{ALERTS}}</aside>

    <nav class="contents" aria-label="Topics in this edition"><span>In this edition:</span></nav>

    <!-- START STORIES: one <section class="topic"> per topic, in the order they should appear.
         Story format (the kicker and Previously lines are optional):
         <article class="story">
           <p class="kicker top">Top story</p>
           <h3><a href="ARTICLE URL" target="_blank" rel="noopener">Headline</a></h3>
           <p>Summary.</p>
           <p class="why"><strong>Why it matters:</strong> Optional line.</p>
           <p class="previously"><strong>Previously:</strong> <a href="2026-10-24.html">Oct 24</a> · <a href="../tracker.html#thread-id">Follow this story ›</a></p>
           <p class="source">Source name, Mon D, YYYY</p>
         </article>
    -->
{{STORIES}}
    <!-- END STORIES -->
  </main>

  <nav class="edition-nav" aria-label="Other editions">
    <span class="prev"></span>
    <a class="front" href="../">Front page</a>
    <span class="next"></span>
  </nav>
  <p class="credit">Compiled each morning by Claude for The Gary Corp. · <a href="../feed.xml">RSS feed</a></p>
</div>

<script>
(function () {
  // Build the "In this edition" links from each topic heading.
  const contents = document.querySelector(".contents");
  document.querySelectorAll(".topic").forEach((sec, i) => {
    const h = sec.querySelector("h2");
    if (!h) return;
    if (!sec.id) sec.id = "topic-" + (i + 1);
    const a = document.createElement("a");
    a.href = "#" + sec.id;
    a.textContent = h.textContent;
    contents.append(a);
  });
  if (contents.querySelectorAll("a").length < 2) contents.remove();

  // Previous and next edition links, read from posts.json.
  const me = document.body.dataset.date;
  const parse = d => new Date(d + "T12:00:00");
  const fmt = d => parse(d).toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric" });
  function put(cls, e, label) {
    const a = document.createElement("a");
    a.href = "../" + e.file;
    a.textContent = label + fmt(e.date);
    document.querySelector(".edition-nav ." + cls).append(a);
  }
  fetch("../posts.json", { cache: "no-store" })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(data => {
      const all = (Array.isArray(data) ? data : data.editions || [])
        .filter(e => e && e.date && e.file).sort((a, b) => a.date < b.date ? -1 : 1);
      const i = all.findIndex(e => e.date === me);
      if (i > 0) put("prev", all[i - 1], "‹ ");
      if (i >= 0 && i < all.length - 1) put("next", all[i + 1], "");
      const next = document.querySelector(".edition-nav .next a");
      if (next) next.textContent += " ›";
    })
    .catch(() => {});
})();
</script>
<script src="../assets/edition.js" defer></script>
</body>
</html>
