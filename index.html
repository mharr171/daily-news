<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Full Stack by The Gary Corp.</title>
<meta name="description" content="A daily roundup of the news I follow.">
<link rel="preload" href="fonts/anton-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/old-standard-tt-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="alternate" type="application/rss+xml" title="Live Full Stack" href="https://www.livefullstack.com/feed.xml">
<link rel="canonical" href="https://www.livefullstack.com/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Live Full Stack">
<meta property="og:title" content="Live Full Stack">
<meta property="og:description" content="A daily roundup of the news I follow.">
<meta property="og:url" content="https://www.livefullstack.com/">
<meta property="og:image" content="https://www.livefullstack.com/social-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Live Full Stack nameplate">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root {
    --paper: #E9E6DD; --ink: #222120; --muted: #5E5A52; --rule: #222120;
    --soft-rule: #B9B3A6; --spot: #A8231B;
    --serif: "Old Standard TT", Georgia, "Times New Roman", serif;
    --display: "Anton", Impact, "Arial Narrow Bold", sans-serif;
    --band: #A8231B; --on-band: #F6EFE6;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1B1A18; --ink: #E7E2D6; --muted: #A59F92; --rule: #E7E2D6;
      --soft-rule: #4A463F; --spot: #E2675C;
      --band: #8E2019; --on-band: #F6EFE6;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 18px/1.55 var(--serif);
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  .page { max-width: 68rem; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
  a { color: inherit; }
  a:focus-visible { outline: 2px solid var(--spot); outline-offset: 4px; }

  /* Masthead */
  .masthead { margin-bottom: .5rem; }
  .cover { display: flex; justify-content: space-between; align-items: flex-end;
           flex-wrap: wrap; gap: .5rem 1.5rem; padding-bottom: .5rem; }
  .nameplate { font-family: var(--display); font-weight: 400; text-transform: uppercase;
               font-size: clamp(3.2rem, 13vw, 7.5rem); line-height: .88; margin: 0;
               letter-spacing: .005em; }
  .issue { margin: 0 0 .35rem auto; text-align: right; font-style: italic; font-size: .95rem;
           line-height: 1.45; color: var(--muted); }
  .band { display: flex; justify-content: space-between; flex-wrap: wrap; gap: .25rem 1rem;
          background: var(--band); color: var(--on-band); padding: .45rem 1rem; font-size: .95rem; }
  .band .tag { font-style: italic; }
  @media (max-width: 30rem) { .issue { text-align: left; margin-left: 0; } }

  /* Lead edition */
  .lead { display: grid; grid-template-columns: 1fr; gap: 1rem 2rem;
          padding: 1.75rem 0; border-bottom: 2px solid var(--rule); }
  @media (min-width: 52rem) { .lead { grid-template-columns: 1.7fr 1fr; } }
  .stamp { color: var(--spot); font-style: italic; margin: 0 0 .35rem; }
  .lead h2 { font-size: clamp(2rem, 5.5vw, 3.6rem); line-height: 1.04; margin: 0 0 1rem;
             letter-spacing: -.01em; }
  .lead h2 a { text-decoration: none; }
  .lead h2 a:hover { text-decoration: underline; text-decoration-thickness: 2px; }
  .summary { margin: 0; text-align: justify; hyphens: auto; }
  .summary::first-letter { font-size: 3.4em; float: left; line-height: .85;
                           padding: .08em .1em 0 0; font-weight: 700; }
  .also { border-left: 1px solid var(--soft-rule); padding-left: 1.5rem; }
  @media (max-width: 51.99rem) { .also { border-left: 0; padding-left: 0;
                                          border-top: 1px solid var(--soft-rule); padding-top: 1rem; } }
  .also h3 { font-size: 1rem; font-style: italic; font-weight: 400; margin: 0 0 .5rem; color: var(--muted); }
  .headlines { list-style: none; margin: 0 0 1rem; padding: 0; }
  .headlines li { padding: .5rem 0; border-bottom: 1px dotted var(--soft-rule); line-height: 1.3; }
  .topic { display: block; font-size: .78rem; font-style: italic; color: var(--muted); }
  .read { display: inline-block; font-weight: 700; border: 2px solid var(--ink);
          padding: .45rem .9rem; text-decoration: none; }
  .read:hover { background: var(--ink); color: var(--paper); }

  /* Earlier editions */
  .section-head { text-align: center; font-size: 1.4rem; margin: 1.75rem 0 1rem; font-weight: 700; }
  .section-head::before, .section-head::after { content: "\2767"; color: var(--spot); margin: 0 .6rem; font-weight: 400; }
  .grid { display: grid; grid-template-columns: 1fr; }
  @media (min-width: 40rem) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 60rem) { .grid { grid-template-columns: repeat(3, 1fr); } }
  .edition { padding: 1rem 1.25rem 1.25rem; border-top: 1px solid var(--soft-rule); }
  @media (min-width: 40rem) { .edition { border-left: 1px solid var(--soft-rule); }
                              .grid > .edition:nth-child(2n+1) { border-left: 0; } }
  @media (min-width: 60rem) { .grid > .edition:nth-child(2n+1) { border-left: 1px solid var(--soft-rule); }
                              .grid > .edition:nth-child(3n+1) { border-left: 0; } }
  .edition .when { font-style: italic; color: var(--muted); font-size: .9rem; margin: 0 0 .3rem; }
  .edition h4 { font-size: 1.35rem; line-height: 1.15; margin: 0 0 .5rem; }
  .edition h4 a { text-decoration: none; }
  .edition h4 a:hover { text-decoration: underline; }
  .edition ul { margin: 0 0 .75rem; padding-left: 1.1rem; font-size: .95rem; }
  .edition li { margin-bottom: .3rem; line-height: 1.3; }
  .edition .more { font-size: .9rem; font-weight: 700; }

  .notice { text-align: center; font-style: italic; color: var(--muted); padding: 3rem 1rem; }
  footer { margin-top: 2.5rem; border-top: 4px double var(--rule); padding-top: .75rem;
           display: flex; justify-content: space-between; flex-wrap: wrap; gap: .5rem;
           font-size: .9rem; color: var(--muted); }

  /* Today strip: weather, alerts, rent reminder */
  .today { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between;
           gap: .3rem 1.25rem; padding: .5rem 0; border-bottom: 1px solid var(--soft-rule); font-size: .92rem; }
  .today[hidden] { display: none; }
  .today .wx, .today .alerts { display: flex; flex-wrap: wrap; gap: .2rem .75rem; align-items: baseline; }
  .today .place { font-style: italic; color: var(--muted); }
  .today .alert { color: var(--spot); font-weight: 700; }
  .today .rent { font-weight: 700; margin-left: auto; }
  .today .rent.due { background: var(--band); color: var(--on-band); padding: .05rem .55rem; }
  .today a { color: inherit; }

  /* Print: black on white, no navigation, link addresses after headlines */
  @media print {
    :root { --paper: #fff; --ink: #000; --muted: #333; --rule: #000; --soft-rule: #999;
            --spot: #000; --band: #fff; --on-band: #000; color-scheme: light; }
    @page { margin: 1.5cm; }
    html, body { background: #fff; }
    body { font-size: 11pt; padding: 0; }
    .page { max-width: none; padding: 0; }
    .band { border-top: 1px solid #000; border-bottom: 1px solid #000; padding: .2rem 0; }
    .home, .contents, .edition-nav, .read, .more, .print-hide { display: none !important; }
    .story, .edition, .lead, .month li { break-inside: avoid; }
    h1, h2, h3, h4 { break-after: avoid; }
    .story h3 a[href^="http"]::after { content: attr(href); display: block; margin-top: .15rem;
                                       font-size: 8pt; font-weight: 400; line-height: 1.3;
                                       word-break: break-all; color: #333; }
    a { text-decoration: none; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <div class="cover">
      <h1 class="nameplate">Live Full Stack</h1>
      <p class="issue"><span id="edition-no">First issue coming soon</span><br><span id="today"></span></p>
    </div>
    <div class="band">
      <span>by The Gary Corp.</span>
      <span class="tag">Gary Garrison’s tailored news</span>
    </div>
    <div class="today print-hide" id="today-strip" hidden aria-live="polite">
      <div class="wx" id="wx"></div>
      <div class="alerts" id="alerts"></div>
      <span class="rent" id="rent" hidden></span>
    </div>
  </header>

  <main id="front-page">
    <p class="notice">Setting the type&hellip;</p>
  </main>

  <footer>
    <span>Compiled each morning by Claude.</span>
    <span><a href="archive.html">Older editions</a> · <a href="feed.xml">RSS feed</a></span>
  </footer>
</div>

<script>
(function () {
  const DAY = 86400000;
  const main = document.getElementById("front-page");

  const parse = d => new Date(d + "T12:00:00");
  const fmtLong = d => parse(d).toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" });
  const fmtShort = d => parse(d).toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric" });

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function link(href, text, cls) { const a = el("a", cls, text); a.href = href; return a; }

  document.getElementById("today").textContent =
    new Date().toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });

  function headlineList(items, cls) {
    const ul = el("ul", cls);
    items.forEach(h => {
      const li = el("li");
      if (cls && h.topic) li.append(el("span", "topic", h.topic));
      li.append(document.createTextNode(h.title));
      ul.append(li);
    });
    return ul;
  }

  function render(all) {
    all = all.filter(e => e && e.date && e.file).sort((a, b) => a.date < b.date ? 1 : -1);
    if (!all.length) {
      main.replaceChildren(el("p", "notice", "The first edition will appear here after tomorrow morning’s update."));
      return;
    }
    const numberOf = e => all.length - all.indexOf(e);
    const cutoff = Date.now() - 7 * DAY;
    let week = all.filter(e => parse(e.date).getTime() >= cutoff);
    if (!week.length) week = all.slice(0, 7);
    week = week.slice(0, 7);

    document.getElementById("edition-no").textContent = "Issue No. " + numberOf(all[0]);

    const [latest, ...earlier] = week;
    const heads = latest.headlines || [];

    const lead = el("section", "lead");
    const left = el("div");
    left.append(el("p", "stamp", "Latest edition, " + fmtLong(latest.date)));
    const h2 = el("h2");
    h2.append(link(latest.file, heads[0] ? heads[0].title : fmtLong(latest.date)));
    left.append(h2);
    if (latest.summary) left.append(el("p", "summary", latest.summary));

    const right = el("aside", "also");
    right.append(el("h3", null, "Also in this edition"));
    right.append(headlineList(heads.slice(1, 5), "headlines"));
    right.append(link(latest.file, "Read the full edition", "read"));
    lead.append(left, right);

    const parts = [lead];
    if (earlier.length) {
      parts.push(el("h2", "section-head", "Earlier this week"));
      const grid = el("div", "grid");
      earlier.forEach(e => {
        const card = el("article", "edition");
        const h = e.headlines || [];
        card.append(el("p", "when", fmtShort(e.date) + ", No. " + numberOf(e)));
        const h4 = el("h4");
        h4.append(link(e.file, h[0] ? h[0].title : fmtLong(e.date)));
        card.append(h4);
        if (h.length > 1) card.append(headlineList(h.slice(1, 3)));
        card.append(link(e.file, "Read this edition", "more"));
        grid.append(card);
      });
      parts.push(grid);
    }
    main.replaceChildren(...parts);
  }

  fetch("posts.json", { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => render(Array.isArray(data) ? data : (data.editions || [])))
    .catch(() => main.replaceChildren(
      el("p", "notice", "The editions list couldn’t be loaded. Refresh the page, or check that posts.json is in the same folder as this page.")));
})();

// Today strip: Millbrae weather (Open-Meteo), NWS alerts for San Mateo County, rent reminder.
(function () {
  const strip = document.getElementById("today-strip");
  const show = () => { strip.hidden = false; };
  const TZ = "America/Los_Angeles";
  const FORECAST = "https://forecast.weather.gov/MapClick.php?lat=37.5985&lon=-122.3872";

  // Rent is due on the 1st of every month (Pacific time).
  const parts = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: TZ, year: "numeric", month: "numeric", day: "numeric" })
    .formatToParts(new Date()).map(p => [p.type, p.value]));
  const y = +parts.year, m = +parts.month, d = +parts.day;
  const daysInMonth = new Date(y, m, 0).getDate();
  const daysLeft = d === 1 ? 0 : daysInMonth - d + 1;
  const rent = document.getElementById("rent");
  if (daysLeft === 0) { rent.textContent = "Rent is due!"; rent.classList.add("due"); }
  else if (daysLeft <= 7) { rent.textContent = "Rent due in " + daysLeft + (daysLeft === 1 ? " day" : " days"); }
  if (rent.textContent) { rent.hidden = false; show(); }

  const WMO = { 0: "Clear", 1: "Mostly clear", 2: "Partly cloudy", 3: "Cloudy", 45: "Fog", 48: "Fog",
    51: "Light drizzle", 53: "Drizzle", 55: "Heavy drizzle", 56: "Freezing drizzle", 57: "Freezing drizzle",
    61: "Light rain", 63: "Rain", 65: "Heavy rain", 66: "Freezing rain", 67: "Freezing rain",
    71: "Light snow", 73: "Snow", 75: "Heavy snow", 77: "Snow", 80: "Showers", 81: "Showers", 82: "Heavy showers",
    85: "Snow showers", 86: "Snow showers", 95: "Thunderstorms", 96: "Thunderstorms with hail", 99: "Thunderstorms with hail" };
  const span = (cls, text) => { const s = document.createElement("span"); if (cls) s.className = cls; s.textContent = text; return s; };

  fetch("https://api.open-meteo.com/v1/forecast?latitude=37.5985&longitude=-122.3872" +
        "&current=temperature_2m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
        "&temperature_unit=fahrenheit&timezone=" + encodeURIComponent(TZ) + "&forecast_days=1")
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(w => {
      const dd = w.daily, r = Math.round;
      const wx = document.getElementById("wx");
      const a = document.createElement("a");
      a.href = FORECAST; a.target = "_blank"; a.rel = "noopener";
      a.textContent = (WMO[dd.weather_code[0]] || "Forecast") + ", high " + r(dd.temperature_2m_max[0]) + "°, low " + r(dd.temperature_2m_min[0]) + "°";
      wx.append(span("place", "Millbrae today:"), a);
      if (dd.precipitation_probability_max[0] >= 20) wx.append(span(null, dd.precipitation_probability_max[0] + "% chance of rain"));
      if (w.current) wx.append(span(null, "Now " + r(w.current.temperature_2m) + "°"));
      show();
    })
    .catch(() => {});

  fetch("https://api.weather.gov/alerts/active?zone=CAC081", { headers: { Accept: "application/geo+json" } })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(j => {
      const seen = new Set();
      const list = (j.features || []).map(f => f.properties).filter(p => p && p.event && !seen.has(p.event) && seen.add(p.event)).slice(0, 2);
      if (!list.length) return;
      const box = document.getElementById("alerts");
      list.forEach(p => {
        const end = p.ends || p.expires;
        const until = end ? " until " + new Date(end).toLocaleString("en-US", { timeZone: TZ, weekday: "short", hour: "numeric", minute: "2-digit" }) : "";
        const a = document.createElement("a");
        a.href = FORECAST; a.target = "_blank"; a.rel = "noopener"; a.className = "alert";
        a.textContent = "⚠ " + p.event + until;
        box.append(a);
      });
      show();
    })
    .catch(() => {});
})();
</script>
</body>
</html>
